name: 构建 B站音频提取 APK

# 手动点 Run workflow 触发;也可在 push 到 main/master 时自动触发
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 释放磁盘空间(移除用不到的预装组件)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖(JDK / 编译工具)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev liblzma-dev python3-dev patch
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          java -version

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.37" "buildozer==1.5.0"

      - name: 构建 APK
        run: buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: '0'

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: biliaudio-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
